<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#230b19">
    <meta name="description" content="A little birthday surprise made with love for Sakshi.">
    <title>For Sakshi, with Love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="sparkles" aria-hidden="true"></div>

    <main class="welcome-card">
        <div class="welcome-copy">
            <div class="eyebrow"><span aria-hidden="true">✦</span> A LITTLE SURPRISE FOR YOU <span aria-hidden="true">✦</span></div>
            <div class="heart-mark" aria-hidden="true">♡</div>
            <p class="for-you">To the girl who has my whole heart</p>
            <h1>In every lifetime,<br><span>I’d find you, Sakshi</span></h1>
            <p class="greeting" aria-live="polite"></p>
            <a class="cta-button" href="cause.html">Step into our little story <span aria-hidden="true">→</span></a>
            <p class="little-note">A birthday love story, written just for you <span aria-hidden="true">♥</span></p>
        </div>
        <figure class="hero-photo">
            <img src="./Static/img4.jpeg" alt="Sakshi reaching back on a mountain journey">
            <figcaption><span aria-hidden="true">♡</span> Wherever life takes us, I’d choose your hand</figcaption>
        </figure>
    </main>

    <audio id="birthday-song" src="./Static/Raabta40.mp3" autoplay loop preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
